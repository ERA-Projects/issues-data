name: Cleanup Draft Releases

on:
  schedule:
    # Запуск в 00:00 первого числа каждого месяца
    - cron: '0 0 1 * *'
  workflow_dispatch: # Кнопка для ручного запуска (удобно для тестирования)

jobs:
  delete-drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Обязательное право для удаления релизов

    steps:
      - name: Delete draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Ищем черновики релизов в репозитории ${{ github.repository }}..."
          
          # Запрашиваем все релизы и через jq фильтруем только те, где draft == true. Сохраняем их ID.
          DRAFT_IDS=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft == true) | .id')
          
          if [ -z "$DRAFT_IDS" ]; then
            echo "Черновики не найдены. Очистка не требуется."
            exit 0
          fi
          
          # Проходимся по каждому найденному ID и отправляем запрос на удаление
          for ID in $DRAFT_IDS; do
            echo "Удаление черновика с ID: $ID..."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/releases/$ID
          done
          
          echo "Все черновики успешно удалены!"