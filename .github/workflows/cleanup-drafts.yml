name: Cleanup Draft Releases

on:
  schedule:
    - cron: "0 0 * * 0" # каждое воскресенье 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Delete draft releases
        run: |
          gh api --paginate repos/:owner/:repo/releases \
            -H "Authorization: token $GITHUB_TOKEN" \
            | jq -r '.[] | select(.draft==true) | .url' \
            | while read url; do
                echo "Deleting draft: $url"
                gh api -X DELETE "$url" -H "Authorization: token $GITHUB_TOKEN"
              done
