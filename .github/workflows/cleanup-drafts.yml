name: Cleanup Draft Releases

on:
  schedule:
    - cron: "0 0 * * 0" # каждое воскресенье в 00:00 UTC
  workflow_dispatch:     # позволяет запускать вручную

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all draft releases
        uses: cli/gh-action@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          script: |
            gh release list --limit 1000 --json url,isDraft \
            | gh api -X DELETE -f url=@<(jq -r '.[] | select(.isDraft==true) | .url')