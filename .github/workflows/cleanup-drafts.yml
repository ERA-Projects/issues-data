name: Cleanup Draft Releases

on:
  schedule:
    - cron: "0 0 * * 0" # каждое воскресенье 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Delete draft releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth login --with-token <<< "$GH_TOKEN"
          gh api --paginate repos/:owner/:repo/releases \
            | jq -r '.[] | select(.draft==true) | .url' \
            | while read url; do
                echo "Deleting draft: $url"
                gh api -X DELETE "$url"
              done